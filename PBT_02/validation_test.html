<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        form {
            background: #fff;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>

    <form>
        <h2>Test Form Validation</h2>
        
        <div class="form-group">
            <label>Trường hợp 1 (text, required)</label>
            <input type="text" required value="">
        </div>

        <div class="form-group">
            <label>Trường hợp 2 (email, value="abc")</label>
            <input type="email" value="abc">
        </div>

        <div class="form-group">
            <label>Trường hợp 3 (number, min=1, max=10, value=15)</label>
            <input type="number" min="1" max="10" value="15">
        </div>

        <div class="form-group">
            <label>Trường hợp 4 (text, pattern="[0-9]{10}", value="abc123")</label>
            <input type="text" pattern="[0-9]{10}" value="abc123">
        </div>

        <div class="form-group">
            <label>Trường hợp 5 (password, minlength=8, value="123")</label>
            <input type="password" minlength="8" value="123">
        </div>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
