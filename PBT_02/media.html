<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu Sản phẩm Multimedia - E-Commerce</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 900px; margin: auto; padding: 20px; background-color: #f9f9f9; }
        h1, h2 { color: #333; border-left: 5px solid #28a745; padding-left: 10px; }
        
        /* CSS cho ảnh Responsive */
        img { max-width: 100%; height: auto; border-radius: 8px; }
        
        /* Bố cục lưới cho danh mục sản phẩm */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        figure { background: white; margin: 0; padding: 10px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        figcaption { margin-top: 10px; font-weight: bold; color: #555; }
        
        .media-section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        iframe, video { width: 100%; border-radius: 8px; }
        svg { display: block; margin: 20px auto; }
    </style>
</head>
<body>

    <header style="text-align: center;">
        <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="80" height="80" fill="#28a745" rx="15" />
            <circle cx="50" cy="50" r="25" fill="white" />
            <text x="50" y="55" font-size="12" text-anchor="middle" fill="#28a745" font-family="Arial" font-weight="bold">LOGO</text>
        </svg>
        <h1>Sản Phẩm Công Nghệ Mới Q1/2026</h1>
    </header>

    <section>
        <h2>Danh mục ảnh sản phẩm</h2>
        <div class="product-grid">
            <figure>
                <img src="https://images.unsplash.com/photo-1616348436168-de43ad0db179?w=500" 
                     alt="iPhone 16 màu Titan Sa Mạc nhìn từ góc nghiêng" 
                     loading="lazy">
                <figcaption>iPhone 16 Pro Max - Bản Titan</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500" 
                     alt="iPad Pro M4 mỏng nhẹ đặt trên mặt bàn gỗ" 
                     loading="lazy">
                <figcaption>iPad Pro M4 Ultra Thin</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" 
                     alt="Tai nghe chụp tai màu đen chống ồn chủ động" 
                     loading="lazy">
                <figcaption>Tai nghe Wireless Noise Cancelling</figcaption>
            </figure>
        </div>
    </section>

    <section class="media-section">
    <h2>Video giới thiệu từ YouTube</h2>
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
        <iframe 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
            title="YouTube video player" 
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>
</section>

    <section class="media-section">
        <h2>Video Review trực tiếp (HTML5 Video)</h2>
        <video controls poster="https://via.placeholder.com/800x450.png?text=Bấm+để+xem+Review">
            <source src="movie.mp4" type="video/mp4">
            <source src="movie.webm" type="video/webm">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>
    </section>

    <section class="media-section" style="text-align: center;">
        <h2>Nghe nhạc nền giới thiệu</h2>
        <p style="font-style: italic; font-size: 0.9em; color: #666;">Bấm Play để nghe mô tả sản phẩm bằng âm thanh</p>
        <audio controls>
            <source src="intro-music.mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ thẻ audio.
        </audio>
    </section>

    <footer style="text-align: center; margin-top: 50px; color: #888; font-size: 0.8em;">
        <p>© 2026 E-Commerce Store - Bài tập thực hành Multimedia</p>
    </footer>

</body>
</html>
