<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán đơn hàng - E-Commerce</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; line-height: 1.6; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* Style cho bảng giỏ hàng */
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #f8f9fa; }
        tfoot { font-weight: bold; background-color: #eee; }

        /* Style cho Form */
        fieldset { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 5px; }
        legend { font-weight: bold; color: #27ae60; padding: 0 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-submit { background-color: #27ae60; color: white; padding: 15px 25px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1.1rem; }
        .btn-submit:hover { background-color: #219150; }
    </style>
</head>
<body>

<div class="container">
    <h1>Thông tin đơn hàng</h1>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Sản phẩm</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>iPhone 16 Pro Max</td>
                <td>25.990.000đ</td>
                <td>1</td>
                <td>25.990.000đ</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Ốp lưng MagSafe</td>
                <td>1.500.000đ</td>
                <td>2</td>
                <td>3.000.000đ</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Củ sạc nhanh 35W</td>
                <td>990.000đ</td>
                <td>1</td>
                <td>990.000đ</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" style="text-align: right;">Tổng cộng:</td>
                <td style="color: red;">29.980.000đ</td>
            </tr>
        </tfoot>
    </table>

    <form action="#" method="POST">
        <fieldset>
            <legend>Phương thức & Ưu đãi</legend>
            <div class="form-group">
                <label>Hình thức thanh toán:</label>
                <input type="radio" id="cod" name="payment" value="cod" checked>
                <label for="cod" style="display: inline;">COD (Giao hàng thu tiền)</label><br>
                <input type="radio" id="bank" name="payment" value="bank">
                <label for="bank" style="display: inline;">Chuyển khoản ngân hàng</label><br>
                <input type="radio" id="wallet" name="payment" value="wallet">
                <label for="wallet" style="display: inline;">Ví điện tử (Momo/ZaloPay)</label>
            </div>
            <div class="form-group">
                <label for="coupon">Mã giảm giá:</label>
                <input type="text" id="coupon" name="coupon" 
                       pattern="SALE[0-9]{4}" 
                       placeholder="VD: SALE2026" 
                       title="Mã giảm giá phải có dạng SALE + 4 chữ số">
            </div>
            <div class="form-group">
                <label for="note">Ghi chú đơn hàng:</label>
                <textarea id="note" name="note" rows="3" placeholder="Yêu cầu đặc biệt (ví dụ: gọi trước khi giao)"></textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>Thông tin nhận hàng</legend>
            <div class="form-group">
                <label for="delivery-date">Ngày giao hàng mong muốn:</label>
                <input type="date" id="delivery-date" name="delivery-date" min="2026-05-02" required>
            </div>
            <div class="form-group">
                <label for="delivery-time">Khung giờ giao:</label>
                <select id="delivery-time" name="delivery-time" required>
                    <option value="">-- Chọn khung giờ --</option>
                    <option value="morning">Sáng (8h - 12h)</option>
                    <option value="afternoon">Chiều (14h - 18h)</option>
                    <option value="evening">Tối (18h - 21h)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="delay">Dự kiến nhận hàng sau (ngày):</label>
                <input type="range" id="delay" name="delay" min="1" max="7" step="1" value="3" 
                       oninput="this.nextElementSibling.value = this.value">
                <output>3</output> ngày
            </div>
        </fieldset>

        <button type="submit" class="btn-submit" aria-label="Xác nhận đặt hàng">
            XÁC NHẬN ĐẶT HÀNG
        </button>
    </form>
</div>

</body>
</html>
