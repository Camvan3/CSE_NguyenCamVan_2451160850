<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - E-Commerce</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; }
        form { max-width: 600px; margin: auto; }
        fieldset { margin-bottom: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
        legend { font-weight: bold; padding: 0 10px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input[type="text"], input[type="email"], input[type="tel"], 
        input[type="password"], input[type="date"], select, textarea {
            width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;
        }
        .radio-group { display: flex; gap: 15px; }
        .radio-group label { display: inline; font-weight: normal; }
        .button-group { display: flex; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 4px; border: none; }
        button[type="submit"] { background-color: #28a745; color: white; }
        button[type="reset"] { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">ĐĂNG KÝ TÀI KHOẢN MỚI</h2>

    <form action="#" method="POST">
        
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <div>
                <label for="fullname">Họ tên:</label>
                <input type="text" id="fullname" name="fullname" required 
                       minlength="2" maxlength="50" placeholder="Nhập họ và tên của bạn">
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required 
                       placeholder="example@gmail.com">
            </div>
            <div>
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" required 
                       pattern="[0-9]{10}" placeholder="09xxxxxxx (10 chữ số)">
            </div>
            <div>
                <label for="dob">Ngày sinh:</label>
                <input type="date" id="dob" name="dob" max="2026-05-01" required>
            </div>
            <div>
                <label>Giới tính:</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Nam</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Nữ</label>
                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Khác</label>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required 
                       pattern="^[A-Za-z0-9_]{3,20}$" 
                       placeholder="Chữ cái, số, underscore (3-20 ký tự)">
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required 
                       minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                       placeholder="Ít nhất 8 ký tự, 1 chữ hoa, 1 số">
            </div>
            <div>
                <label for="confirm-password">Xác nhận password:</label>
                <input type="password" id="confirm-password" name="confirm_password" required 
                       minlength="8" placeholder="Nhập lại mật khẩu giống hệt bên trên">
            </div>
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <div>
                <label for="city">Thành phố:</label>
                <select id="city" name="city" required>
                    <option value="">-- Chọn Thành phố --</option>
                    <option value="hanoi">Hà Nội</option>
                    <option value="hcm">TP. Hồ Chí Minh</option>
                    <option value="danang">Đà Nẵng</option>
                    <option value="haiphong">Hải Phòng</option>
                    <option value="cantho">Cần Thơ</option>
                </select>
            </div>
            <div>
                <label for="district">Quận/Huyện:</label>
                <select id="district" name="district" required>
                    <option value="">-- Chọn Quận/Huyện --</option>
                    <option value="q1">Quận 1</option>
                    <option value="caugiay">Cầu Giấy</option>
                    <option value="haichau">Hải Châu</option>
                </select>
            </div>
            <div>
                <label for="address">Địa chỉ chi tiết:</label>
                <textarea id="address" name="address" rows="3" 
                          placeholder="Số nhà, tên đường, phường/xã..."></textarea>
            </div>
        </fieldset>

        <div>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms" style="display: inline;">Tôi đồng ý với các điều khoản và dịch vụ</label>
        </div>

        <div class="button-group">
            <button type="submit">Gửi</button>
            <button type="reset">Reset</button>
        </div>

    </form>

</body>
</html>
