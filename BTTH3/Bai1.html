<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hệ Thống Quản Lý Sinh Viên</h1>
        <div class="stats-container">
        <div class="stat-card">
            <h3>Tổng số sinh viên</h3>
            <p id="total-students">0</p>
        </div>
        <div class="stat-card">
            <h3> Điểm trung bình</h3>
            <p id="average-score">0.0</p>
        </div>
        </div>
        <div class="toolbar">
            <button id="btn-open-modal" class="btn btn-primary">Thêm sinh viên</button>
        </div>
        <table class="student-table">
            <thead>
                <tr>
                    <th>Mã SV</th>
                    <th>Họ và Tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp học</th>
                    <th>ĐTB</th>
                    <th>Email</th>
                    <th>Thao tac</th>
                </tr>
            </thead>
            <tbody id="student-list">

            </tbody>
        </table>
    </div>
    <div id="student-modal" class="modal">
        <div class="modal-content">
            <span id="btn-close-modal" class="close-btn">&times;</span>
            <h2 id="modal-title">Thêm sinh viên</h2>
            <form id="student-form">
                <input type="hidden" id="student-id">
                <div class="form-group">
                    <label for="student-code">Mã SV</label>
                    <input type="text" id="student-code" required>                   
                </div>
                <div class="form-group">
                    <label for="student-name">Họ và Tên:</label>
                    <input type="text" id="student-name" required>
                </div>
                <div class="form-group">
                    <label for="student-dob">Ngày sinh:</label>
                    <input type="date" id="student-dob" required>
                </div>
                <div class="form-group">
                    <label for="student-gpa">ĐTB:</label>
                    <input type="number" id="student-gpa" min="0" max="10" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="student-class">Lớp:</label>
                    <input type="text" id="student-class" required>
                </div>
                <div class="form-group">
                    <label for="student-email">Email:</label>
                    <input type="text" id="student-email" required>
                </div>
                <div class="form-actions">
                    <button type="button" id="btn-cancel" class="btn btn-secondary">Hủy</button>
                    <button type="submit" id="btn-submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
<script src="app.js"></script>
</body>
</html>
