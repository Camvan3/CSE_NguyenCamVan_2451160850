<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>todos</h1>
        
        <div class="todo-card">
            <form id="todoForm" class="todo-input-form">
                <input type="text" id="todoInput" placeholder="What needs to be done?" autocomplete="off">
            </form>

            <ul id="todoList" class="todo-list">
                </ul>

            <footer class="todo-footer" id="todoFooter">
                <span class="todo-count" id="todoCount">0 items left</span>
                
                <div class="todo-filters" id="todoFilters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                
                <button id="clearCompletedBtn" class="clear-completed-btn">Clear completed</button>
            </footer>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
