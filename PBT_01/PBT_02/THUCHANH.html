<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập Form Validation - Nguyễn Cẩm Vân</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background-color: #f0f2f5; }
        form { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { margin-top: 25px; padding: 12px; background: #1877f2; color: white; border: none; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #166fe5; }
    </style>
</head>
<body>
<form action="#" method ="POST">
    <fieldset>
        <legend> Thông tin tài khoản</legend>
        <label for ="email">Email:</label>
        <input type ="email" id ="email" name ="email" required
        placeholder="you@email.com"
        <label for ="pass">Mật khẩu:</label>
        <input type ="password" id="pass" name="pass" required
        minlength="8"
        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
        title="Ít nhất 8 ký tự, gồm chữ hoa, chữ thường và số">
        <label for="phone">SĐT:</label>
        <input type ="tel" id="phone" name ="phone"
        pattern="[0-9]{10}" placeholder="0987654321">
        <label for="dob" >Ngày sinh:</label>
        <input type "date" id ="dob" name="dob" max="2026-05-01">

    </fieldset>
    <label>
        <input type ="checkbox" name="agree" required>
        Tôi đồng ý điều khoản
    </label>
    <button type="submit">Đăng ký</button>
</form>
