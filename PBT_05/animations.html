<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transitions & Animations</title>
  <link rel="stylesheet" href="animations.css">
</head>
<body>

  <!-- Hiệu ứng 4: Loading Spinner (Hiển thị đầu trang khi tải) -->
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <p>Đang tải sản phẩm...</p>
  </div>

  <h1 class="page-title">Cửa Hàng Thời Trang</h1>

  <div class="product-container">
    
    <article class="product-card fade-in-element">
      <div class="image-zoom-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7351cgZdOUDttX4VQabhyifQWbUB9_7HBJA&s" alt="Sản phẩm">
      </div>
      <div class="card-info">
        <h4>Áo Hoodie Streetwear v1</h4>
        <p class="price">450.000đ</p>
        <button class="btn-buy">Mua ngay</button>
      </div>
    </article>

    <!-- Card 2 -->
    <article class="product-card fade-in-element">
      <div class="image-zoom-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhDX8QU8SDt3xRw38AuzvDg12ldDi2cKNyoQ&s" alt="Sản phẩm">
      </div>
      <div class="card-info">
        <h4>Áo Sweater Fleece Varsity</h4>
        <p class="price">380.000đ</p>
        <button class="btn-buy">Mua ngay</button>
      </div>
    </article>

    <!-- Card 3 -->
    <article class="product-card fade-in-element">
      <div class="image-zoom-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvop-dO2rsVc8Te6yO5jOKbIiK5a7ok1FNwg&s" alt="Sản phẩm">
      </div>
      <div class="card-info">
        <h4>Quần Cargo Pants Khaki</h4>
        <p class="price">520.000đ</p>
        <button class="btn-buy">Mua ngay</button>
      </div>
    </article>

    <!-- Card 4 -->
    <article class="product-card fade-in-element">
      <div class="image-zoom-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSF9L3wGOrN7LXUfdP3zfGs1syBBoq09vgBDA&s" alt="Sản phẩm">
      </div>
      <div class="card-info">
        <h4>Mũ Beanie Minimalist</h4>
        <p class="price">150.000đ</p>
        <button class="btn-buy">Mua ngay</button>
      </div>
    </article>

  </div>

</body>
</html>
