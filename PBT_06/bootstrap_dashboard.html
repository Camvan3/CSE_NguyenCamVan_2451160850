<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="position-fixed top-0 start-0 bottom-0 bg-dark text-white p-3" style="width: 200px;">
        <h5 class="text-center py-2 border-bottom">ADMIN</h5>
        <div class="list-group list-group-flush">
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white active">Tổng quan</a>
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white">Đơn hàng</a>
        </div>
    </div>

    <div style="margin-left: 200px;" class="p-4">

        <!-- ALERT THÔNG BÁO -->
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            Thành công! Dữ liệu đã cập nhật.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center bg-white p-2 rounded shadow-sm mb-4">
            <nav class="breadcrumb mb-0">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active">Dashboard</li>
                </ol>
            </nav>
            <div class="dropdown">
                <button class="btn btn-sm btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Admin</button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#">Hồ sơ</a></li>
                    <li><a class="dropdown-item text-danger" href="#">Đăng xuất</a></li>
                </ul>
            </div>
        </div>

        <div class="row g-2 mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Tìm kiếm...">
                    <button class="btn btn-dark">Tìm kiếm</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="input-group">
                    <label class="input-group-text">Lọc</label>
                    <select class="form-select">
                        <option>Tất cả trạng thái</option>
                        <option>Đã giao</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-3"><div class="card bg-primary text-white p-3"><h6>Doanh thu</h6><h3>150M</h3></div></div>
            <div class="col-6 col-lg-3"><div class="card bg-success text-white p-3"><h6>Đơn hàng</h6><h3>+1,200</h3></div></div>
            <div class="col-6 col-lg-3"><div class="card bg-warning text-dark p-3"><h6>Khách mới</h6><h3>350</h3></div></div>
            <div class="col-6 col-lg-3"><div class="card bg-danger text-white p-3"><h6>Hủy đơn</h6><h3>14</h3></div></div>
        </div>

        <div class="bg-white p-3 rounded shadow-sm mb-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr><th>Mã đơn</th><th>Khách hàng</th><th>Giá trị</th><th>Trạng thái</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>#01</td><td>Nguyễn Văn An</td><td>15M</td><td><span class="badge bg-success">Đã giao</span></td></tr>
                        <tr><td>#02</td><td>Trần Thị Khánh</td><td>4M</td><td><span class="badge bg-warning text-dark">Chờ xử lý</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="accordion" id="faq">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#q1">Câu hỏi 1</button>
                </h2>
                <div id="q1" class="accordion-collapse collapse show" data-bs-parent="#faq">
                    <div class="accordion-body">Câu trả lời</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
